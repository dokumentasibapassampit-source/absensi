<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sistem Presensi Wajah</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
    .nav { margin-bottom: 15px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; }
    button.active { background-color: #007bff; color: white; border-color: #007bff; }
    #container { position: relative; width: 400px; height: 300px; margin: 0 auto; background: #222; border-radius: 8px; overflow: hidden; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .form-group { margin-top: 15px; }
    input { padding: 8px; width: 200px; border-radius: 4px; border: 1px solid #ccc; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <h2>Sistem Presensi Wajah</h2>

  <div class="nav">
    <button id="btnAbsen" class="active" onclick="switchMode('absen')">Menu Absensi</button>
    <button id="btnRekam" onclick="switchMode('rekam')">Menu Rekam Wajah</button>
  </div>

  <div id="container">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div id="formRekam" class="form-group" style="display:none;">
    <input type="text" id="namaInput" placeholder="Masukkan Nama Lengkap">
    <button id="btnDaftar" onclick="prosesRekamWajah()" style="background:#28a745; color:white;">Daftarkan Wajah</button>
  </div>

  <div id="status">Memulai kamera...</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwp7OuP3Q4OtMMXR9Y1BjPLBeyFgIy5Pa5TFm0agCFVWdMiebxBD6UCVO6sCDBUbA4PYQ/exec";

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    let currentMode = 'absen';
    let isProcessing = false;
    let faceMatcher = null;

    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;

        statusDiv.innerText = "Memuat AI pengenal wajah...";
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark64Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        await muatDatabaseWajah();
      } catch (err) {
        statusDiv.innerText = "Gagal memuat: " + err.message;
      }
    }

    async function muatDatabaseWajah() {
      try {
        statusDiv.innerText = "Mengambil data dari Google Sheets...";
        const response = await fetch(APPS_SCRIPT_URL + "?action=getDatabase");
        const data = await response.json();

        if (data && data.length > 0) {
          const labeledDescriptors = data.map(item => {
            const desc = new Float32Array(item.descriptor);
            return new faceapi.LabeledFaceDescriptors(item.nama, [desc]);
          });
          faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
          statusDiv.innerText = "Sistem Siap! Silakan hadap kamera untuk absen.";
        } else {
          statusDiv.innerText = "Database kosong. Silakan rekam wajah dulu.";
        }
      } catch (err) {
        statusDiv.innerText = "Gagal memuat database.";
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnAbsen').className = mode === 'absen' ? 'active' : '';
      document.getElementById('btnRekam').className = mode === 'rekam' ? 'active' : '';
      document.getElementById('formRekam').style.display = mode === 'rekam' ? 'block' : 'none';
      statusDiv.innerText = mode === 'absen' ? "Mode Absensi Aktif" : "Masukkan nama lalu klik Daftarkan Wajah";
    }

    function kirimDataViaForm(params, callback) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = APPS_SCRIPT_URL;
      form.target = 'hidden_iframe';

      for (const key in params) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = params[key];
        form.appendChild(input);
      }

      let iframe = document.getElementById('hidden_iframe');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'hidden_iframe';
        iframe.name = 'hidden_iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);

      setTimeout(callback, 1500);
    }

    video.addEventListener('play', () => {
      const container = document.getElementById('container');
      const existingCanvas = container.querySelector('canvas');
      if (existingCanvas) existingCanvas.remove();

      const canvas = faceapi.createCanvasFromMedia(video);
      container.append(canvas);
      
      const displaySize = { width: 400, height: 300 };
      faceapi.matchDimensions(canvas, displaySize);

      setInterval(async () => {
        if (isProcessing || !faceMatcher || currentMode !== 'absen') return;

        const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

        if (detections.length > 0) {
          const resizedDetections = faceapi.resizeResults(detections, displaySize);
          
          for (const detection of resizedDetections) {
            const result = faceMatcher.findBestMatch(detection.descriptor);
            
            if (result.label !== 'unknown' && !isProcessing) {
              isProcessing = true;
              statusDiv.innerText = "Wajah Terdeteksi: " + result.label + "! Mencatat...";

              kirimDataViaForm({ action: 'catatAbsensi', nama: result.label }, () => {
                statusDiv.innerText = "✅ Absensi BERHASIL untuk: " + result.label;
                setTimeout(() => { isProcessing = false; }, 4000);
              });
            }
          }
        }
      }, 1000);
    });

    async function prosesRekamWajah() {
      const namaInput = document.getElementById('namaInput');
      const btnDaftar = document.getElementById('btnDaftar');
      const nama = namaInput.value.trim();
      
      if (!nama) {
        alert("Harap isi nama!");
        return;
      }

      btnDaftar.disabled = true;
      statusDiv.innerText = "Merekam wajah...";

      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

      if (detection) {
        const descriptorArray = JSON.stringify(Array.from(detection.descriptor));
        
        kirimDataViaForm({ action: 'simpanWajah', nama: nama, descriptor: descriptorArray }, () => {
          alert("✅ Wajah " + nama + " BERHASIL didaftarkan!");
          namaInput.value = '';
          btnDaftar.disabled = false;
          muatDatabaseWajah();
        });
      } else {
        alert("Wajah tidak terdeteksi! Pastikan pencahayaan terang.");
        statusDiv.innerText = "Silakan coba lagi.";
        btnDaftar.disabled = false;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
