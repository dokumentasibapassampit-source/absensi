<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sistem Presensi Sederhana</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 40px; }
    .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
    select, button { width: 100%; padding: 12px; margin-top: 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
    button { background-color: #28a745; color: white; font-weight: bold; border: none; }
    button:hover { background-color: #218838; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Absensi Kehadiran</h2>
    <p>Pilih nama Anda lalu klik tombol Absen</p>
    
    <select id="namaSelect">
      <option value="">-- Memuat Daftar Nama --</option>
    </select>

    <button onclick="kirimAbsen()">Kirim Absen Sekarang</button>
    <div id="status"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwp7OuP3Q4OtMMXR9Y1BjPLBeyFgIy5Pa5TFm0agCFVWdMiebxBD6UCVO6sCDBUbA4PYQ/exec";

    // Ambil daftar nama otomatis dari Google Sheets saat halaman dibuka
    async function muatDaftarNama() {
      try {
        const response = await fetch(APPS_SCRIPT_URL + "?action=getDatabase");
        const data = await response.json();
        const select = document.getElementById('namaSelect');
        select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
        
        if (data && data.length > 0) {
          data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.nama;
            opt.innerText = item.nama;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = '<option value="">Belum ada nama terdaftar</option>';
        }
      } catch (err) {
        document.getElementById('status').innerText = "Gagal memuat daftar nama.";
      }
    }

    async function kirimAbsen() {
      const nama = document.getElementById('namaSelect').value;
      const statusDiv = document.getElementById('status');

      if (!nama) {
        alert("Silakan pilih nama Anda terlebih dahulu!");
        return;
      }

      statusDiv.innerText = "Mengirim data...";

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ action: 'catatAbsensi', nama: nama })
        });

        statusDiv.style.color = "green";
        statusDiv.innerText = "✅ Absensi Berhasil Tercatat untuk: " + nama;
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Gagal mengirim absen.";
      }
    }

    window.onload = muatDaftarNama;
  </script>
</body>
</html>
